<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPOS — Business POS</title>
    <style>
        :root { --prim:#2c3e50; --accent:#27ae60; --warn:#e74c3c; --bg:#f8f9fa; --card:#fff; --txt:#333; }
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,sans-serif}
        body{background:var(--bg);color:var(--txt)}
        .container{max-width:1200px;margin:0 auto;padding:1rem}
        .hidden{display:none !important}
        .card{background:var(--card);border-radius:10px;padding:1.25rem;margin:.75rem 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        button{padding:.6rem 1.2rem;border:none;border-radius:6px;cursor:pointer;font-size:.95rem;margin:.25rem}
        .btn-primary{background:var(--accent);color:#fff}
        .btn-danger{background:var(--warn);color:#fff}
        .btn-secondary{background:var(--prim);color:#fff}
        input,select{padding:.5rem;border:1px solid #ddd;border-radius:5px;margin:.3rem;width:100%;max-width:350px}
        table{width:100%;border-collapse:collapse;margin-top:.75rem}
        th,td{padding:.6rem;text-align:left;border-bottom:1px solid #eee}
        .nav{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
        .status-indicator{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4rem}
        .online{background:#27ae60}
        .offline{background:#e74c3c}
        .lang-switch{float:right}
        h2{margin-bottom:.75rem;color:var(--prim)}
    </style>
</head>
<body>

<div class="container">
    <!-- Language Switch & Status -->
    <div style="display:flex;justify-content:space-between;align-items:center">
        <h1>BPOS — Business POS</h1>
        <div>
            <span id="status"><span class="status-indicator offline"></span><span id="statusText">Offline</span></span>
            <select id="langSwitch" class="lang-switch">
                <option value="en">English</option>
                <option value="tl">Tagalog</option>
            </select>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="card">
        <h2 data-txt="login">Login</h2>
        <p data-txt="setupFirstTime" style="color:#666;font-size:.9rem;margin-bottom:.5rem">→ Set admin password on first use</p>
        <div>
            <label data-txt="role">Role:</label>
            <select id="userRole">
                <option value="admin">Admin</option>
                <option value="cashier">Cashier</option>
                <option value="sp">Service Provider</option>
            </select>
        </div>
        <div>
            <label data-txt="password">Password:</label>
            <input type="password" id="passInput" placeholder="Enter password">
        </div>
        <button class="btn-primary" onclick="login()" data-txt="loginBtn">Login</button>
        <p id="loginMsg" style="margin-top:.5rem;color:var(--warn)"></p>
    </div>

    <!-- Main POS Screen -->
    <div id="mainScreen" class="hidden">
        <div class="nav">
            <button onclick="showSection('sales')" data-txt="sales">Sales</button>
            <button onclick="showSection('shifts')" data-txt="shifts">Shifts</button>
            <button onclick="showSection('reports')" data-txt="reports">Reports</button>
            <button onclick="showSection('settings')" data-txt="settings">Settings</button>
            <button class="btn-danger" onclick="logout()" style="margin-left:auto" data-txt="logout">Logout</button>
        </div>

        <!-- Sales Section -->
        <div id="sec-sales" class="card">
            <h2 data-txt="newSale">New Sale</h2>
            <div>
                <label data-txt="itemName">Item/Service:</label>
                <input type="text" id="itemName" placeholder="Item name">
            </div>
            <div>
                <label data-txt="price">Price:</label>
                <input type="number" step="0.01" id="itemPrice" placeholder="0.00">
            </div>
            <div>
                <label data-txt="qty">Quantity:</label>
                <input type="number" value="1" min="1" id="itemQty">
            </div>
            <div>
                <label data-txt="paymentMethod">Payment Method:</label>
                <select id="payMethod">
                    <option value="cash">Cash</option>
                    <option value="gcash">GCash</option>
                    <option value="card">Card</option>
                    <option value="credit">Credit</option>
                </select>
            </div>
            <div>
                <label data-txt="store">Store/Branch:</label>
                <input type="text" id="storeName" placeholder="Main Branch">
            </div>
            <button class="btn-primary" onclick="addSale()" data-txt="recordSale">Record Sale</button>
            <h3 style="margin-top:1rem" data-txt="recentSales">Recent Sales</h3>
            <table><thead><tr><th data-txt="item">Item</th><th data-txt="total">Total</th><th data-txt="method">Method</th><th data-txt="store">Store</th><th data-txt="time">Time</th></tr></thead><tbody id="salesList"></tbody></table>
        </div>

        <!-- Shifts Section -->
        <div id="sec-shifts" class="card hidden">
            <h2 data-txt="shiftMgmt">Shift Management</h2>
            <div>
                <label data-txt="cashierName">Cashier Name:</label>
                <input type="text" id="cashierName" placeholder="Enter name">
            </div>
            <button class="btn-primary" onclick="startShift()" data-txt="startShift">Start Shift</button>
            <button class="btn-danger" onclick="endShift()" data-txt="endShift">End Shift</button>
            <p id="shiftStatus" style="margin-top:.5rem"></p>
            <h3 style="margin-top:1rem" data-txt="shiftHistory">Shift History</h3>
            <table><thead><tr><th data-txt="cashier">Cashier</th><th data-txt="start">Start</th><th data-txt="end">End</th><th data-txt="shiftSales">Sales</th></tr></thead><tbody id="shiftList"></tbody></table>
        </div>

        <!-- Reports Section -->
        <div id="sec-reports" class="card hidden">
            <h2 data-txt="reports">Reports</h2>
            <p><strong data-txt="totalSales">Total Sales:</strong> ₱<span id="totalSalesAmt">0.00</span></p>
            <p><strong data-txt="salesCount">Transactions:</strong> <span id="salesCountNum">0</span></p>
            <button class="btn-secondary" onclick="exportData()" data-txt="export">Export Data</button>
        </div>

        <!-- Settings Section (Admin Only) -->
        <div id="sec-settings" class="card hidden">
            <h2 data-txt="settings">Settings</h2>
            <div>
                <label data-txt="changePass">Change Admin Password:</label>
                <input type="password" id="newPass" placeholder="New password">
            </div>
            <button class="btn-primary" onclick="changeAdminPass()" data-txt="updatePass">Update Password</button>
            <p id="setMsg" style="margin-top:.5rem"></p>
        </div>
    </div>
</div>

<script>
// ── Translations ─────────────────────────────
const LANG = {
    en: {
        login:"Login", setupFirstTime:"Set a password on first use", role:"Role:", password:"Password:", loginBtn:"Login",
        sales:"Sales", shifts:"Shifts", reports:"Reports", settings:"Settings", logout:"Logout",
        newSale:"New Sale", itemName:"Item/Service:", price:"Price:", qty:"Quantity:", paymentMethod:"Payment Method:",
        store:"Store/Branch:", recordSale:"Record Sale", recentSales:"Recent Sales",
        item:"Item", total:"Total", method:"Method", time:"Time",
        shiftMgmt:"Shift Management", cashierName:"Cashier Name:", startShift:"Start Shift", endShift:"End Shift",
        shiftHistory:"Shift History", cashier:"Cashier", start:"Start", end:"End", shiftSales:"Sales",
        totalSales:"Total Sales:", salesCount:"Transactions:", export:"Export Data",
        changePass:"Change Admin Password:", updatePass:"Update Password",
        onlineStatus:"Online", offlineStatus:"Offline", accessDenied:"Access Denied", invalidPass:"Invalid Password",
        passSet:"Admin password set successfully", shiftStarted:"Shift started", shiftEnded:"Shift ended",
        noPerm:"No permission", fillFields:"Fill in all fields"
    },
    tl: {
        login:"Mag-log in", setupFirstTime:"Magtakda ng password sa unang paggamit", role:"Tungkulin:", password:"Password:", loginBtn:"Mag-log in",
        sales:"Benta", shifts:"Oras ng Trabaho", reports:"Ulat", settings:"Mga Setting", logout:"Mag-log out",
        newSale:"Bagong Benta", itemName:"Produkto/Serbisyo:", price:"Presyo:", qty:"Dami:", paymentMethod:"Paraan ng Pagbabayad:",
        store:"Tindahan/Sangay:", recordSale:"Itala ang Benta", recentSales:"Mga Kamakailang Benta",
        item:"Bagay", total:"Kabuuan", method:"Paraan", time:"Oras",
        shiftMgmt:"Pamamahala ng Oras", cashierName:"Pangalan ng Tindero:", startShift:"Simulan ang Oras", endShift:"Tapusin ang Oras",
        shiftHistory:"Kasaysayan ng Oras", cashier:"Tindero", start:"Simula", end:"Wakas", shiftSales:"Benta",
        totalSales:"Kabuuang Benta:", salesCount:"Bilang ng Transaksyon:", export:"I-export ang Datos",
        changePass:"Palitan ang Admin Password:", updatePass:"I-update ang Password",
        onlineStatus:"Konektado", offlineStatus:"Walang Koneksyon", accessDenied:"Bawal ang Pagpasok", invalidPass:"Maling Password",
        passSet:"Matagumpay na naitakda ang password", shiftStarted:"Nagsimula na ang oras", shiftEnded:"Natapos na ang oras",
        noPerm:"Walang Pahintulot", fillFields:"Punan ang lahat ng patlang"
    }
};

let currentLang = localStorage.getItem("bpos_lang") || "en";
let currentUser = null;
let sales = JSON.parse(localStorage.getItem("bpos_sales") || "[]");
let shifts = JSON.parse(localStorage.getItem("bpos_shifts") || "[]");
let adminHash = localStorage.getItem("bpos_admin_hash") || "";
let activeShift = JSON.parse(localStorage.getItem("bpos_activeshift") || "null");

// ── Helpers ──────────────────────────────────
function t(key){ return LANG[currentLang][key] || key; }
function updateUI(){
    document.querySelectorAll("[data-txt]").forEach(el=>el.textContent=t(el.dataset.txt));
    document.getElementById("statusText").textContent=navigator.onLine?t("onlineStatus"):t("offlineStatus");
    document.querySelector(".status-indicator").className="status-indicator "+(navigator.onLine?"online":"offline");
}
function hash(s){ let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h.toString(16); }
function saveData(){
    localStorage.setItem("bpos_sales",JSON.stringify(sales));
    localStorage.setItem("bpos_shifts",JSON.stringify(shifts));
    localStorage.setItem("bpos_activeshift",JSON.stringify(activeShift));
    localStorage.setItem("bpos_lang",currentLang);
    autoSync();
}
function autoSync(){
    if(navigator.onLine) console.log("[BPOS] Synced to storage — ready for cloud/GitHub sync");
}

// ── Auth ─────────────────────────────────────
function login(){
    const role=document.getElementById("userRole").value;
    const pass=document.getElementById("passInput").value;
    if(!adminHash && role==="admin"){
        if(pass.length<3) return document.getElementById("loginMsg").textContent=t("fillFields");
        adminHash=hash(pass);
        localStorage.setItem("bpos_admin_hash",adminHash);
        document.getElementById("loginMsg").textContent=t("passSet");
    }
    if(role==="admin"){
        if(hash(pass)!==adminHash) return document.getElementById("loginMsg").textContent=t("invalidPass");
    }
    currentUser={role};
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("mainScreen").classList.remove("hidden");
    refreshSales(); refreshShifts(); updateReports();
    applyPermissions();
}
function logout(){
    currentUser=null; activeShift=null; saveData();
    document.getElementById("mainScreen").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("passInput").value="";
}
function applyPermissions(){
    if(currentUser?.role!=="admin") document.getElementById("sec-settings").classList.add("hidden");
}

// ── Sales ───────────────────────────────────
function addSale(){
    const name=document.getElementById("itemName").value.trim();
    const price=parseFloat(document.getElementById("itemPrice").value||0);
    const qty=parseInt(document.getElementById("itemQty").value||1);
    const method=document.getElementById("payMethod").value;
    const store=document.getElementById("storeName").value.trim()||"Main Branch";
    if(!name||price<=0) return alert(t("fillFields"));
    const total=price*qty;
    sales.unshift({item:name,total,method,store,time:new Date().toLocaleString()});
    if(activeShift) activeShift.sales+=total;
    saveData(); refreshSales(); updateReports();
    document.getElementById("itemName").value=""; document.getElementById("itemPrice").value="";
}
function refreshSales(){
    document.getElementById("salesList").innerHTML=sales.slice(0,15).map(s=>
        `<tr><td>${s.item}</td><td>₱${s.total.toFixed(2)}</td><td>${s.method}</td><td>${s.store}</td><td>${s.time}</td></tr>`
    ).join("");
}

// ── Shifts ──────────────────────────────────
function startShift(){
    if(currentUser?.role==="sp") return alert(t("noPerm"));
    const name=document.getElementById("cashierName").value.trim();
    if(!name) return alert(t("fillFields"));
    activeShift={cashier:name,start:new Date().toLocaleString(),end:null,sales:0};
    saveData(); refreshShifts();
    document.getElementById("shiftStatus").textContent=t("shiftStarted")+": "+name;
}
function endShift(){
    if(!activeShift) return;
    activeShift.end=new Date().toLocaleString();
    shifts.unshift({...activeShift});
    activeShift=null; saveData(); refreshShifts();
    document.getElementById("shiftStatus").textContent=t("shiftEnded");
}
function refreshShifts(){
    document.getElementById("shiftList").innerHTML=shifts.map(s=>
        `<tr><td>${s.cashier}</td><td>${s.start}</td><td>${s.end||"-"}</td><td>₱${s.sales.toFixed(2)}</td></tr>`
    ).join("");
}

// ── Reports & Settings ──────────────────────
function updateReports(){
    const total=sales.reduce((sum,s)=>sum+s.total,0);
    document.getElementById("totalSalesAmt").textContent=total.toFixed(2);
    document.getElementById("salesCountNum").textContent=sales.length;
}
function exportData(){
    const data={sales,shifts,exported:new Date().toLocaleString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="bpos-export.json";
    a.click();
}
function changeAdminPass(){
    if(currentUser?.role!=="admin") return alert(t("noPerm"));
    const newP=document.getElementById("newPass").value;
    if(newP.length<3) return alert(t("fillFields"));
    adminHash=hash(newP);
    localStorage.setItem("bpos_admin_hash",adminHash);
    document.getElementById("setMsg").textContent=t("passSet");
    document.getElementById("newPass").value="";
}
function showSection(id){
    document.querySelectorAll("[id^=sec-]").forEach(s=>s.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
}

// ── Init ─────────────────────────────────────
document.getElementById("langSwitch").value=currentLang;
document.getElementById("langSwitch").onchange=e=>{ currentLang=e.target.value; updateUI(); };
window.ononline=window.onoffline=updateUI;
updateUI();
</script>
</body>
</html>
