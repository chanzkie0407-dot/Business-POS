<!DOCTYPE html>
<html>
<head>
  <title>Receipt - Minute Burger</title>
  <meta charset="UTF-8">
  <style>
    *{margin:0; padding:0; box-sizing:border-box;}
    .receipt{width:300px; padding:10px; font-family:Arial; font-size:13px;}
    .center{text-align:center;}
    .bold{font-weight:bold;}
    .fs16{font-size:16px;}
    .fs12{font-size:12px;}
    .fs11{font-size:11px;}
    .grey{color:#444;}
    .flex{display:flex; justify-content:space-between;}
    .dashed{border:none; border-top:1px dashed #000; margin:5px 0;}
    .item{padding:2px 0;}
    .total{font-size:15px; font-weight:bold; margin-top:4px;}
    @media print{.receipt{margin:0;} button{display:none;}}
  </style>
</head>
<body>

<div class="receipt" id="receipt">
  <!-- DYNAMIC STORE HEADER -->
  <div class="center bold fs16" id="storeNameHeader"></div>
  <div class="center fs11 grey" style="margin:4px 0 8px;">Minute Burger • Authorized Franchisee</div>
  <hr class="dashed">

  <!-- CASHIER & DATE INFO -->
  <div class="flex fs12">
    <span>Cashier: <span id="cashierName"></span></span>
    <span>Date: <span id="transDate"></span></span>
  </div>
  <div class="flex fs12" style="margin:2px 0 6px;">
    <span>Shift: <span id="shiftNo"></span></span>
    <span>Time: <span id="transTime"></span></span>
  </div>
  <hr class="dashed">

  <!-- ITEMS LIST -->
  <div id="itemsList"></div>
  <hr class="dashed">

  <!-- PAYMENT SUMMARY -->
  <div id="paymentSummary"></div>
  <hr class="dashed">

  <!-- FOOTER -->
  <div class="center fs11" style="margin-top:8px;">Thank You! Please Come Again.</div>
</div>

<button onclick="printReceipt()" style="margin-top:10px; padding:6px 12px;">Print Receipt</button>

<script>
// ===== SESSION DATA (FROM YOUR LOGIN SYSTEM) =====
const SESSION = {
  store: localStorage.getItem("selectedStore") || "Store1",  // store1 / Davao1 / etc.
  cashier: localStorage.getItem("cashierName") || "Cashier",
  shift: localStorage.getItem("shiftNumber") || "1"
};

// ===== SAMPLE TRANSACTION DATA =====
const TRANS = {
  items: [
    {name:"Burger Regular", qty:2, price:65.00},
    {name:"Fries", qty:1, price:45.00}
  ],
  payment:{
    subtotal:175.00,
    discount:0.00,
    total:175.00,
    cash:200.00,
    change:25.00
  }
};

// ===== LOAD RECEIPT =====
function loadReceipt(){
  // Header info
  document.getElementById("storeNameHeader").textContent = SESSION.store;
  document.getElementById("cashierName").textContent = SESSION.cashier;
  document.getElementById("shiftNo").textContent = SESSION.shift;
  const now = new Date();
  document.getElementById("transDate").textContent = now.toLocaleDateString();
  document.getElementById("transTime").textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  // Items
  let itemsHtml = "";
  TRANS.items.forEach(i=>{
    itemsHtml += `<div class="flex item fs12"><span>${i.name} x${i.qty}</span><span>₱${(i.price*i.qty).toFixed(2)}</span></div>`;
  });
  document.getElementById("itemsList").innerHTML = itemsHtml;

  // Payment
  const p = TRANS.payment;
  let payHtml = `
    <div class="flex fs12"><span>Subtotal</span><span>₱${p.subtotal.toFixed(2)}</span></div>
    <div class="flex fs12"><span>Discount</span><span>₱${p.discount.toFixed(2)}</span></div>
    <div class="flex total"><span>TOTAL</span><span>₱${p.total.toFixed(2)}</span></div>
    <div class="flex fs12" style="margin-top:4px;"><span>Cash</span><span>₱${p.cash.toFixed(2)}</span></div>
    <div class="flex fs12 bold"><span>Change</span><span>₱${p.change.toFixed(2)}</span></div>
  `;
  document.getElementById("paymentSummary").innerHTML = payHtml;
}

// ===== PRINT FUNCTION =====
function printReceipt(){ window.print(); }

// ===== AUTO RUN =====
window.onload = loadReceipt;
</script>
</body>
</html>
