<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — BPOS</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>Admin Dashboard</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn-logout">Log Out</button>
      </div>
    </header>

    <nav class="admin-nav">
      <button class="tab-btn active" data-tab="cashiers">Cashier Accounts</button>
      <button class="tab-btn" data-tab="stores">Stores</button>
      <button class="tab-btn" data-tab="reports">Sales Reports</button>
    </nav>

    <main class="admin-content">
      <!-- Cashier Accounts Tab -->
      <section id="cashiers" class="tab-content active">
        <h2>Manage Cashier Accounts</h2>
        <form id="cashier-form" class="form-card">
          <div class="form-row">
            <label>First Name:</label>
            <input type="text" id="cfname" required>
          </div>
          <div class="form-row">
            <label>Last Name:</label>
            <input type="text" id="clname">
          </div>
          <div class="form-row">
            <label>Store ID:</label>
            <input type="text" id="cstore" required placeholder="e.g. DVO01">
          </div>
          <div class="form-row">
            <label>Password:</label>
            <input type="text" id="cpass" required placeholder="e.g. 1234">
          </div>
          <button type="submit" class="btn-primary">Add Cashier</button>
        </form>

        <h3>Existing Cashiers</h3>
        <div id="cashier-list" class="list-container"></div>
      </section>

      <!-- Stores Tab -->
      <section id="stores" class="tab-content">
        <h2>Manage Stores</h2>
        <form id="store-form" class="form-card">
          <div class="form-row">
            <label>Store ID:</label>
            <input type="text" id="sid" required placeholder="e.g. DVO01">
          </div>
          <div class="form-row">
            <label>Store Name:</label>
            <input type="text" id="sname" required>
          </div>
          <div class="form-row">
            <label>Location:</label>
            <input type="text" id="sloc">
          </div>
          <button type="submit" class="btn-primary">Add Store</button>
        </form>
        <h3>Store List</h3>
        <div id="store-list" class="list-container"></div>
      </section>

      <!-- Reports Tab -->
      <section id="reports" class="tab-content">
        <h2>Sales Reports</h2>
        <p>Coming soon — Daily, Weekly, Monthly Sales</p>
      </section>
    </main>
  </div>

<script type="module">
import { requireAuth } from '../protect.js';
import { logout } from '../login.js';

const user = requireAuth(['admin']);
if (!user) {}

document.getElementById('user-name').textContent = user?.name || 'Admin';
document.getElementById('logout-btn').addEventListener('click', logout);

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

// Cashiers
function loadCashiers() {
  const list = document.getElementById('cashier-list');
  const cashiers = JSON.parse(localStorage.getItem('cashiers') || '[]');
  list.innerHTML = cashiers.length === 0 ? '<p>No cashiers added yet.</p>' : cashiers.map((c, i) => `
    <div class="item-card">
      <strong>${c.name} ${c.lastName || ''}</strong><br>
      Store: ${c.storeId} | Password: ${c.password}
      <button data-idx="${i}" class="btn-delete">Delete</button>
    </div>
  `).join('');
  list.querySelectorAll('.btn-delete').forEach(b => {
    b.addEventListener('click', () => {
      const all = JSON.parse(localStorage.getItem('cashiers') || '[]');
      all.splice(parseInt(b.dataset.idx), 1);
      localStorage.setItem('cashiers', JSON.stringify(all));
      loadCashiers();
    });
  });
}

document.getElementById('cashier-form').addEventListener('submit', e => {
  e.preventDefault();
  const cashiers = JSON.parse(localStorage.getItem('cashiers') || '[]');
  cashiers.push({
    id: Date.now(),
    name: document.getElementById('cfname').value.trim(),
    lastName: document.getElementById('clname').value.trim(),
    storeId: document.getElementById('cstore').value.trim(),
    password: document.getElementById('cpass').value.trim()
  });
  localStorage.setItem('cashiers', JSON.stringify(cashiers));
  e.target.reset();
  loadCashiers();
});

// Stores
function loadStores() {
  const list = document.getElementById('store-list');
  const stores = JSON.parse(localStorage.getItem('stores') || '[]');
  list.innerHTML = stores.length === 0 ? '<p>No stores added yet.</p>' : stores.map((s, i) => `
    <div class="item-card">
      <strong>${s.storeId} — ${s.name}</strong><br>
      ${s.location || ''}
      <button data-idx="${i}" class="btn-delete">Delete</button>
    </div>
  `).join('');
  list.querySelectorAll('.btn-delete').forEach(b => {
    b.addEventListener('click', () => {
      const all = JSON.parse(localStorage.getItem('stores') || '[]');
      all.splice(parseInt(b.dataset.idx), 1);
      localStorage.setItem('stores', JSON.stringify(all));
      loadStores();
    });
  });
}

document.getElementById('store-form').addEventListener('submit', e => {
  e.preventDefault();
  const stores = JSON.parse(localStorage.getItem('stores') || '[]');
  stores.push({
    storeId: document.getElementById('sid').value.trim(),
    name: document.getElementById('sname').value.trim(),
    location: document.getElementById('sloc').value.trim()
  });
  localStorage.setItem('stores', JSON.stringify(stores));
  e.target.reset();
  loadStores();
});

loadCashiers();
loadStores();
</script>

<style>
.admin-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
.user-info { display: flex; gap: 15px; align-items: center; }
.btn-logout { padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; }
.admin-nav { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn { padding: 10px 20px; border: none; background: #e5e7eb; border-radius: 6px; cursor: pointer; }
.tab-btn.active { background: #4f46e5; color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.form-card { background: white; padding: 25px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.form-row { margin-bottom: 15px; }
.form-row label { display: block; margin-bottom: 5px; font-weight: 500; }
.form-row input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
.list-container { display: flex; flex-direction: column; gap: 10px; }
.item-card { background: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.btn-delete { padding: 6px 12px; background: #fee2e2; color: #b91c1c; border: none; border-radius: 4px; cursor: pointer; }
</style>
</body>
</html>
